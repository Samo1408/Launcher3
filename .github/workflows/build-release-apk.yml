name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      BUILD_TOOLS_VERSION: '30.0.3'
      # Gradle 4.6 matches AGP 3.1.x used in Launcher3 o-mr1.
      GRADLE_VERSION: '4.6'

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ──────────────────────────────────────────────────────────────────
      # sdkmanager v16+ requires JDK 17 or later.
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # ── Gradle ───────────────────────────────────────────────────────────────
      # Installs standalone Gradle so we can generate gradlew if the repo
      # does not commit it (common in AOSP forks).
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found — generating wrapper (Gradle ${{ env.GRADLE_VERSION }})"
            gradle wrapper \
              --gradle-version "${{ env.GRADLE_VERSION }}" \
              --distribution-type all
          fi
          chmod +x gradlew

      # ── Android SDK ───────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools & platforms
        run: |
          sdkmanager --install \
            "platforms;android-27" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # ── Apply patches ─────────────────────────────────────────────────────────
      - name: Apply modification patches
        run: |
          set -e
          PATCH_DIR=".github/patches"
          if [ ! -d "$PATCH_DIR" ]; then echo "No patches dir — skipping."; exit 0; fi

          git config user.email "ci@github-actions"
          git config user.name  "GitHub Actions"

          PATCHES=$(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort)
          if [ -z "$PATCHES" ]; then echo "No *.patch files — skipping."; exit 0; fi

          for PATCH in $PATCHES; do
            echo "▶ Applying $PATCH"
            git apply --whitespace=fix --reject "$PATCH" || \
              echo "::warning::Patch $PATCH had conflicts — check *.rej files"
          done
          echo "All patches applied."

      # ── Gradle cache ──────────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleLauncherRelease --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Sign ──────────────────────────────────────────────────────────────────
      # Repo secrets needed (Settings → Secrets → Actions):
      #   KEYSTORE_BASE64    – base-64 encoded .jks / .keystore
      #   KEY_STORE_PASSWORD – keystore password
      #   KEY_ALIAS          – key alias
      #   KEY_PASSWORD       – key password
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/launcher/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Zipalign ──────────────────────────────────────────────────────────────
      - name: Zipalign signed APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          ALIGNED="${APK%.apk}-aligned.apk"
          $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/zipalign -v -p 4 "$APK" "$ALIGNED"
          echo "ALIGNED_APK=$ALIGNED" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Unsigned fallback ─────────────────────────────────────────────────────
      - name: Locate unsigned APK (no keystore configured)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          APK=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "ALIGNED_APK=$APK" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Version ───────────────────────────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "name=${{ github.event.inputs.version_name || 'dev' }}-$SHORT" >> $GITHUB_OUTPUT
          fi

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher3-modified-${{ steps.version.outputs.name }}
          path: ${{ env.ALIGNED_APK }}
          retention-days: 30
          if-no-files-found: error

      # ── GitHub Release (tag pushes only) ──────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Launcher3 Modified ${{ github.ref_name }}
          files: ${{ env.ALIGNED_APK }}
          body: |
            ## Launcher3 Modified — ${{ github.ref_name }}

            ### Features
            - App drawer **Personal / Work** tabs
            - Long-press menu: Advanced Permissions, Share App, Install to User,
              Show Data Dir, Show App Dir, Select
            - **Double-tap empty desktop to sleep**
            - Root utilities (RootUtils, UserProfileHelper, ApkShareHelper)

            > Root-only features require a rooted device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
