name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '11'
      BUILD_TOOLS_VERSION: '30.0.3'

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # ── Android SDK ─────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools & platforms
        run: |
          sdkmanager --install \
            "platforms;android-27" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # ── Apply patches ────────────────────────────────────────────────────────
      # All patches live in .github/patches/ and are applied in filename order.
      # Each patch is in unified diff format (git diff style).
      - name: Apply modification patches
        run: |
          set -e
          PATCH_DIR=".github/patches"
          if [ ! -d "$PATCH_DIR" ]; then
            echo "No patches directory found at $PATCH_DIR — skipping patch step."
            exit 0
          fi

          echo "Configuring git for patch application…"
          git config user.email "ci@github-actions"
          git config user.name  "GitHub Actions"

          PATCHES=$(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort)
          if [ -z "$PATCHES" ]; then
            echo "No *.patch files found in $PATCH_DIR — skipping."
            exit 0
          fi

          for PATCH in $PATCHES; do
            echo "▶ Applying $PATCH"
            # --reject keeps going; failures are stored as *.rej for inspection
            git apply --whitespace=fix --reject "$PATCH" || {
              echo "::warning::Patch $PATCH had conflicts — check *.rej files"
            }
          done
          echo "All patches applied."

      # ── Gradle wrapper ──────────────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleLauncherRelease --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Sign ────────────────────────────────────────────────────────────────
      # Store the following secrets in your repo:
      #   KEYSTORE_BASE64      – base-64 encoded .jks / .keystore file
      #   KEY_STORE_PASSWORD   – keystore password
      #   KEY_ALIAS            – key alias inside the keystore
      #   KEY_PASSWORD         – key password
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/launcher/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Align (zipalign) ────────────────────────────────────────────────────
      - name: Zipalign signed APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          ALIGNED="${APK%.apk}-aligned.apk"
          $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/zipalign \
            -v -p 4 "$APK" "$ALIGNED"
          echo "ALIGNED_APK=$ALIGNED" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Rename unsigned fallback ─────────────────────────────────────────────
      - name: Locate unsigned APK (no keystore)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          APK=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "ALIGNED_APK=$APK" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Determine version tag ────────────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.inputs.version_name || 'dev' }}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher3-modified-${{ steps.version.outputs.name }}
          path: ${{ env.ALIGNED_APK }}
          retention-days: 30
          if-no-files-found: error

      # ── GitHub Release (tag pushes only) ─────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Launcher3 Modified ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ env.ALIGNED_APK }}
          body: |
            ## Launcher3 Modified — ${{ github.ref_name }}

            ### Features in this build
            - App drawer with **Personal / Work** tabs
            - Work tab: auto-folder per secondary user profile
            - Desktop: one folder per user profile with all their apps
            - Long-press menu additions:
              - **Advanced Permissions** (usage stats, all-files, unknown sources)
              - **Share App** (single APK or merged .apks bundle for split apps)
              - **Install to User** (`pm install-existing --user <id>` via root)
              - **Show Data Dir** (opens `/data/data/<pkg>` in root file manager)
              - **Show App Dir** (opens `/data/app/<pkg>` in root file manager)
              - **Select** (multi-select for merge / uninstall / share)
            - **Double-tap empty desktop area to sleep**
            - Root support

            > **Note:** Root-only features require a rooted device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
